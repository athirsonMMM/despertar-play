name: Publicar Despertar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar build v0.7.0
        shell: bash
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp story-v0.7.css _site/story-v0.7.css
          cp story-v0.7.js _site/story-v0.7.js
          sed -i 's/v0\.6\.3/v0.7.0/g' _site/index.html
          sed -i 's/despertar-v063-save/despertar-v070-save/g' _site/index.html
          sed -i 's/x:520,y:610,r:18,speed:190/x:560,y:520,r:18,speed:190/g' _site/index.html
          perl -0777 -i -pe 's/function tryMove\(nx,ny\)\{.*?\}\nfunction hurtPlayer/function tryMove(nx,ny){const map=world===\x27city\x27?city:world===\x27guild\x27?guild:camp;player.x=Math.max(28,Math.min(map.w-28,nx));player.y=Math.max(28,Math.min(map.h-28,ny))}\nfunction hurtPlayer/s' _site/index.html
          sed -i 's#</head>#<link rel="stylesheet" href="story-v0.7.css"></head>#' _site/index.html
          sed -i 's#</body>#<script src="story-v0.7.js"></script></body>#' _site/index.html

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
