name: Publicar Despertar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar build v0.7.2
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp story-v0.7.css _site/story-v0.7.css
          cp story-v0.7.js _site/story-v0.7.js
          python3 build-v071.py
          python3 campaign-patch-v071.py
          python3 run-gameplay-v072.py

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
