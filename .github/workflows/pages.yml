name: Publicar Despertar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar build browser MMORPG v1.0.3
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html app.css app.js art.js _site/
          cp -r assets _site/assets

      - name: Validar build v1.0.3
        run: |
          test -f _site/index.html
          test -f _site/app.css
          test -f _site/app.js
          test -f _site/art.js
          test -f _site/assets/real/city-bg.webp
          test -f _site/assets/real/city.webp
          test -f _site/assets/real/guild.webp
          test -f _site/assets/real/guerreiro-sheet.png
          test -f _site/assets/real/mago-sheet.png
          test -f _site/assets/real/arqueiro-sheet.png
          test -f _site/assets/real/ladino-sheet.png
          test -f _site/assets/real/elena.webp
          test -f _site/assets/real/goblin-sheet.png
          test -f _site/assets/real/portal.png
          grep -q 'DESPERTAR ONLINE v1.0.3' _site/index.html
          grep -q 'data-page="guild"' _site/index.html
          grep -q "KeyW" _site/app.js
          grep -q "KeyA" _site/app.js
          grep -q "KeyS" _site/app.js
          grep -q "KeyD" _site/app.js
          grep -q "Infestação de Goblins" _site/app.js
          grep -q "battleScene" _site/app.js
          grep -q "ShiftLeft" _site/app.js
          grep -q "battle-mobile-controls" _site/app.css
          grep -q "goblin-sprite" _site/app.js
          grep -q "ART.mobs" _site/app.js
          grep -q "ART.portal" _site/app.js
          grep -Fq "document.querySelectorAll('[data-battle]')" _site/app.js
          grep -Fq "generatedAttributes(selectedRegisterClass)" _site/app.js
          grep -Fq "attributePoints" _site/app.js
          grep -Fq "function combatPower()" _site/app.js
          grep -Fq "function spawnProjectile" _site/app.js
          grep -Fq "fx-sword-slash" _site/app.css
          grep -Fq "projectile-fireball" _site/app.css
          grep -Fq "projectile-arrow" _site/app.css
          grep -Fq "$('[data-page]').forEach" _site/app.js
          if grep -Fq "attackBattle(" _site/app.js; then
            echo "Handler antigo de ataque ainda presente"
            exit 1
          fi
          if grep -q "goblin-body" _site/app.js; then
            echo "Placeholder geométrico de Goblin ainda presente"
            exit 1
          fi
          node --check _site/app.js
          node --check _site/art.js
          python3 - <<'PY'
          from pathlib import Path
          html = Path('_site/index.html').read_text(encoding='utf-8')
          required = ['authScreen','gameShell','mainStage','chatLog','sideNav']
          missing = [x for x in required if f'id="{x}"' not in html]
          if missing:
              raise SystemExit('DOM obrigatório ausente: ' + ', '.join(missing))
          print('Smoke DOM OK')
          PY

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
