name: Publicar Despertar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar build v0.6.6
        shell: bash
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          python3 - <<'PY'
          from pathlib import Path
          p = Path('_site/index.html')
          s = p.read_text(encoding='utf-8')

          # Versão e save limpo.
          s = s.replace('v0.6.3', 'v0.6.6')
          s = s.replace('despertar-v063-save', 'despertar-v066-save')

          # Posição inicial em área livre.
          s = s.replace('x:520,y:610,r:18,speed:190', 'x:560,y:520,r:18,speed:190')

          # v0.6.6: remove a colisão do personagem com objetos/cenário.
          # Mantém somente os limites externos do mapa para evitar sair da área jogável.
          old_move = "function tryMove(nx,ny){const map=world==='city'?city:world==='guild'?guild:camp,obs=map.obstacles||[];nx=Math.max(28,Math.min(map.w-28,nx));ny=Math.max(28,Math.min(map.h-28,ny));let tx=nx,ty=player.y;if(!obs.some(o=>circleRectHit(tx,ty,player.r,o)))player.x=tx;tx=player.x;ty=ny;if(!obs.some(o=>circleRectHit(tx,ty,player.r,o)))player.y=ty}"
          new_move = "function tryMove(nx,ny){const map=world==='city'?city:world==='guild'?guild:camp;player.x=Math.max(28,Math.min(map.w-28,nx));player.y=Math.max(28,Math.min(map.h-28,ny))}"
          if old_move not in s:
              raise SystemExit('Função tryMove original não encontrada')
          s = s.replace(old_move, new_move, 1)

          # Camada robusta de teclado/touch preservada da v0.6.5.
          marker = "bindStick('moveStick',(x,y)=>moveVec={x,y});bindStick('attackStick',()=>{},true);"
          robust = r'''bindStick('moveStick',(x,y)=>moveVec={x,y});bindStick('attackStick',()=>{},true);

const moveCodeMap={KeyW:'w',KeyA:'a',KeyS:'s',KeyD:'d',ArrowUp:'arrowup',ArrowLeft:'arrowleft',ArrowDown:'arrowdown',ArrowRight:'arrowright'};
window.addEventListener('keydown',e=>{
  const k=moveCodeMap[e.code];
  if(k){keys[k]=true;e.preventDefault();}
  if(e.code==='KeyE'){interact();e.preventDefault();}
},{passive:false});
window.addEventListener('keyup',e=>{
  const k=moveCodeMap[e.code];
  if(k){keys[k]=false;e.preventDefault();}
},{passive:false});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;moveVec={x:0,y:0};});

(()=>{
  const el=document.getElementById('moveStick'),knob=el.querySelector('.knob');
  const setTouch=(touch)=>{
    const r=el.getBoundingClientRect();
    let dx=touch.clientX-(r.left+r.width/2),dy=touch.clientY-(r.top+r.height/2);
    const max=42,l=Math.hypot(dx,dy)||1;
    if(l>max){dx=dx/l*max;dy=dy/l*max;}
    moveVec={x:dx/max,y:dy/max};
    knob.style.transform=`translate(${dx}px,${dy}px)`;
  };
  el.addEventListener('touchstart',e=>{if(e.touches[0])setTouch(e.touches[0]);e.preventDefault();},{passive:false});
  el.addEventListener('touchmove',e=>{if(e.touches[0])setTouch(e.touches[0]);e.preventDefault();},{passive:false});
  const stop=e=>{moveVec={x:0,y:0};knob.style.transform='translate(0,0)';e.preventDefault();};
  el.addEventListener('touchend',stop,{passive:false});
  el.addEventListener('touchcancel',stop,{passive:false});
})();'''
          if marker not in s:
              raise SystemExit('Marcador do controle não encontrado')
          s = s.replace(marker, robust, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
