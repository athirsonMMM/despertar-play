name: Publicar Despertar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar build v0.9.0
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp story-v0.7.css _site/story-v0.7.css
          cp story-v0.7.js _site/story-v0.7.js
          cp -r assets _site/assets
          python3 build-v071.py
          python3 campaign-patch-v071.py
          python3 run-gameplay-v072.py
          python3 dialogue-patch-v073.py
          python3 chapter2-patch-v074.py
          python3 story-fix-v074.py
          python3 chapter3-patch-v075.py
          python3 chapter4-patch-v076.py
          python3 systems-patch-v080.py
          python3 story-cap-v080.py
          python3 mission-completion-patch-v081.py
          python3 visual-overhaul-v090.py

      - name: Validar build v0.9.0
        run: |
          test -f _site/assets/scenes/city.svg
          test -f _site/assets/scenes/guild.svg
          test -f _site/assets/sprites/guerreiro.svg
          test -f _site/assets/sprites/mago.svg
          test -f _site/assets/sprites/arqueiro.svg
          test -f _site/assets/sprites/ladino.svg
          test -f _site/assets/sprites/elena-portrait.svg
          grep -q 'v0.9.0' _site/index.html
          grep -q 'sceneLayer' _site/index.html
          grep -q 'sideCombatWorld' _site/index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('_site/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, flags=re.S)
          if not scripts:
              raise SystemExit('Nenhum JavaScript inline encontrado em index.html')
          Path('/tmp/despertar-inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/despertar-inline.js
          node --check _site/story-v0.7.js

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
